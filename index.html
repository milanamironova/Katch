
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Based on You</title>

    * {

    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f4f0;
      color: #151515;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 116px;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      z-index: 20;
    }

    .topbar-inner {
      padding: 24px 34px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
    }

    .brand h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: -1.1px;
      font-weight: 850;
    }

    .brand p {
      margin: 6px 0 0;
      color: #777;
      font-size: 14px;
    }

    .search {
      flex: 1;
      max-width: 560px;
      background: #f0f0ed;
      border-radius: 999px;
      padding: 14px 18px;
      color: #858585;
      font-size: 14px;
    }

    .profile {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1c1c1c, #aaa);
      flex: 0 0 auto;
    }

    .board-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .horizontal-board {
      height: 100%;
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 24px 34px 34px;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
    }

    .horizontal-board::-webkit-scrollbar {
      height: 9px;
    }

    .horizontal-board::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.04);
      border-radius: 999px;
      margin: 0 34px;
    }

    .horizontal-board::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border-radius: 999px;
    }

    .category-column {
      width: calc((100vw - 68px - 54px) / 4);
      min-width: calc((100vw - 68px - 54px) / 4);
      max-width: 360px;
      height: 100%;
      overflow: hidden;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      flex: 0 0 auto;
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 2px 0 14px;
      background: linear-gradient(to bottom, #f5f4f0 72%, rgba(245,244,240,0));
    }

    .column-kicker {
      color: #8a8a8a;
      font-size: 11px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.85px;
      margin-bottom: 6px;
    }

    .column-title {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.7px;
      font-weight: 860;
    }

    .column-feed {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .column-feed::-webkit-scrollbar {
      width: 0;
      display: none;
    }

    .card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.07);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.11);
    }

    .visual-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      cursor: grab;
      background: #eee;
    }

    .visual-carousel::-webkit-scrollbar {
      display: none;
    }

    .visual-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .visual-slide img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .card.tall .visual-slide img {
      height: 390px;
    }

    .card.small .visual-slide img {
      height: 230px;
    }

    .image-counter {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      color: #222;
    }

    .card-content {
      padding: 14px 15px 16px;
      cursor: pointer;
    }

    .tag {
      display: inline-block;
      background: #f4f4f1;
      color: #6f6f6f;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 9px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.12;
      letter-spacing: -0.35px;
      font-weight: 850;
    }

    .card-text {
      margin: 8px 0 0;
      color: #666;
      font-size: 13px;
      line-height: 1.42;
    }

    .hint {
      margin-top: 11px;
      color: #8a8a8a;
      font-size: 11px;
    }

    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 10px 30px rgba(0,0,0,0.16);
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-size: 22px;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .nav-arrow:hover {
      transform: translateY(-50%) scale(1.06);
      background: white;
    }

    .nav-left {
      left: 20px;
    }

    .nav-right {
      right: 20px;
    }

    .position-indicator {
      position: fixed;
      right: 34px;
      bottom: 24px;
      z-index: 30;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      color: #555;
      box-shadow: 0 8px 24px rgba(0,0,0,0.09);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 34px;
    }

    .modal {
      width: min(1120px, 94vw);
      max-height: 90vh;
      background: #fff;
      border-radius: 34px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      box-shadow: 0 30px 90px rgba(0,0,0,0.28);
      position: relative;
    }

    .modal-left {
      min-height: 640px;
      background: #f5f5f2;
    }

    .modal-carousel {
      height: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .modal-carousel::-webkit-scrollbar {
      display: none;
    }

    .modal-carousel img {
      flex: 0 0 100%;
      width: 100%;
      min-height: 640px;
      object-fit: cover;
      scroll-snap-align: start;
    }

    .modal-content {
      padding: 36px;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(245,245,245,0.94);
      cursor: pointer;
      font-size: 22px;
      z-index: 5;
    }

    .modal-title {
      font-size: 36px;
      line-height: 1;
      letter-spacing: -1px;
      font-weight: 850;
      margin: 0 0 14px;
    }

    .modal-description {
      color: #555;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .info-box {
      background: #f7f7f5;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      color: #555;
      font-size: 14px;
      line-height: 1.45;
    }

    .info-box strong {
      display: block;
      color: #171717;
      margin-bottom: 6px;
    }

    .screenshot-title {
      font-size: 20px;
      font-weight: 850;
      margin: 24px 0 12px;
      letter-spacing: -0.3px;
    }

    .screenshot-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .screenshot-row::-webkit-scrollbar {
      display: none;
    }

    .screenshot-card {
      flex: 0 0 178px;
      overflow: hidden;
      border-radius: 18px;
      background: #fafafa;
      border: 1px solid #eeeeec;
    }

    .screenshot-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .screenshot-card div {
      padding: 10px;
      font-size: 12px;
      color: #555;
      line-height: 1.35;
    }

    .empty-screenshots {
      background: #f7f7f5;
      border-radius: 18px;
      padding: 16px;
      color: #666;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (min-width: 1500px) {
      .category-column {
        width: calc((100vw - 68px - 126px) / 8);
        min-width: calc((100vw - 68px - 126px) / 8);
      }

      .visual-slide img {
        height: 255px;
      }

      .card.tall .visual-slide img {
        height: 330px;
      }

      .card.small .visual-slide img {
        height: 205px;
      }
    }

    @media (min-width: 1900px) {
      .category-column {
        width: calc((100vw - 68px - 162px) / 10);
        min-width: calc((100vw - 68px - 162px) / 10);
      }
    }

    @media (max-width: 1100px) {
      .category-column {
        width: calc((100vw - 68px - 18px) / 2);
        min-width: calc((100vw - 68px - 18px) / 2);
      }

      .modal {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }

      .modal-left,
      .modal-carousel img {
        min-height: 360px;
      }
    }
  </style>
</head>

      <div class="position-indicator" id="positionIndicator">Columns 1–4</div>
    </div>

  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">×</button>

      <div class="modal-left">
        <div class="modal-carousel" id="modalCarousel"></div>
      </div>

      <div class="modal-content">

        </div>

        <div class="info-box">
          <strong>Product information</strong>
          <span id="modalProductInfo"></span>
        </div>

        <div class="screenshot-title">Based on these screenshots</div>
        <div class="screenshot-row" id="screenshotRow"></div>
      </div>
    </div>
  </div>

    let flatItems = [];

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      flatItems = [];

      columns.forEach((column, columnIndex) => {
        board.innerHTML += `
          <section class="category-column">
            <div class="column-header">
              <div class="column-kicker">${column.kicker}</div>
              <h2 class="column-title">${column.category}</h2>
            </div>
            <div class="column-feed" id="column-${columnIndex}"></div>
          </section>
        `;

        column.items.forEach((item, itemIndex) => {
          flatItems.push({
            ...item,
            category: column.category,
            columnIndex,
            itemIndex
          });
        });
      });

      columns.forEach((column, columnIndex) => {
        const feed = document.getElementById(`column-${columnIndex}`);
        column.items.forEach((item, itemIndex) => {
          const globalIndex = flatItems.findIndex(
            flatItem => flatItem.columnIndex === columnIndex && flatItem.itemIndex === itemIndex
          );
          feed.innerHTML += createCard(item, column.category, globalIndex, itemIndex);
        });
      });

      updatePositionIndicator();
    }

    function createCard(item, category, globalIndex, itemIndex) {
      const sizeClass = itemIndex % 3 === 0 ? "tall" : itemIndex % 3 === 2 ? "small" : "";
      const slides = item.images.map((img, imgIndex) => `
        <div class="visual-slide">
          <img src="${img}" alt="">
          <div class="image-counter">${imgIndex + 1} / ${item.images.length}</div>
        </div>
      `).join("");

      return `
        <article class="card ${sizeClass}">
          <div class="visual-carousel">
            ${slides}
          </div>

          <div class="card-content" onclick="openModal(${globalIndex})">
            <div class="tag">${category}</div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.description}</p>
            <div class="hint">Scroll image sideways. Click text for details.</div>
          </div>
        </article>
      `;
    }

    function scrollBoard(direction) {
      const board = document.getElementById("board");
      const column = document.querySelector(".category-column");
      const gap = 18;
      const amount = column.offsetWidth + gap;

      board.scrollBy({
        left: direction * amount * 4,
        behavior: "smooth"
      });

      setTimeout(updatePositionIndicator, 350);
    }

    function updatePositionIndicator() {
      const board = document.getElementById("board");
      const column = document.querySelector(".category-column");
      const indicator = document.getElementById("positionIndicator");

      if (!column) return;

      const gap = 18;
      const columnWidth = column.offsetWidth + gap;
      const firstVisible = Math.floor(board.scrollLeft / columnWidth) + 1;

      const visibleCount = Math.min(
        10,
        Math.max(1, Math.round(board.clientWidth / columnWidth))
      );

      const lastVisible = Math.min(columns.length, firstVisible + visibleCount - 1);

      indicator.innerText = `Columns ${firstVisible}–${lastVisible}`;
    }

    function openModal(globalIndex) {
      const item = flatItems[globalIndex];

      document.getElementById("modalCategory").innerText = item.category;
      document.getElementById("modalTitle").innerText = item.title;
      document.getElementById("modalDescription").innerText = item.description;
      document.getElementById("modalReason").innerText = "You are receiving this recommendation because you uploaded this screenshot and it appears visually connected to this category, mood or product universe.";
      document.getElementById("modalProductInfo").innerText = item.productInfo;

      const modalCarousel = document.getElementById("modalCarousel");
      modalCarousel.innerHTML = item.images.map(img => `<img src="${img}" alt="">`).join("");

      const screenshotRow = document.getElementById("screenshotRow");
      screenshotRow.innerHTML = "";

      if (uploadedScreenshots.length === 0) {
        screenshotRow.innerHTML = `
          <div class="empty-screenshots">
            No uploaded screenshots found yet. Create a folder called <strong>uploaded_screenshots</strong> on your Desktop, add the screenshots inside it, then rerun the notebook.
          </div>
        `;
      } else {
        uploadedScreenshots.forEach((screenshot, index) => {
          screenshotRow.innerHTML += `
            <div class="screenshot-card">
              <img src="${screenshot.src}" alt="Uploaded screenshot ${index + 1}">
              <div>Uploaded screenshot ${index + 1}</div>
            </div>
          `;
        });
      }

      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    function closeModalOutside(event) {
      if (event.target.id === "modalOverlay") {
        closeModal();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight") {
        scrollBoard(1);
      }

      if (event.key === "ArrowLeft") {
        scrollBoard(-1);
      }

      if (event.key === "Escape") {
        closeModal();
      }
    });

    document.getElementById("board").addEventListener("scroll", updatePositionIndicator);

    renderBoard();
  </script>
