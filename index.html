<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Katch">
  <title>Katch — Discover the hidden</title>

  <style>
    :root {
      --background: #f7f4ee;
      --card: #fffdf9;
      --text: #151311;
      --secondary: #766f67;
      --line: rgba(29, 24, 19, 0.09);
      --shadow: 0 14px 36px rgba(42, 34, 25, 0.09);
      --header-height: 126px;
      --nav-height: 71px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .app {
      position: fixed;
      inset: 0;
      background: var(--background);
      overflow: hidden;
    }

    /* Header */

    .header {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 20;
      height: calc(var(--header-height) + var(--safe-top));
      padding: calc(17px + var(--safe-top)) 18px 12px;
      background: rgba(247, 244, 238, 0.95);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -1.8px;
      line-height: 0.95;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      padding-top: 2px;
    }

    .round-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 253, 249, 0.9);
      color: var(--text);
      font-size: 18px;
    }

    .browse-row {
      margin-top: 21px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--secondary);
      font-size: 12px;
    }

    .browse-row strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
    }

    .position {
      min-width: 68px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    /* Horizontal category board */

    .category-board {
      position: absolute;
      top: calc(var(--header-height) + var(--safe-top));
      bottom: calc(var(--nav-height) + var(--safe-bottom));
      left: 0;
      right: 0;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px 14px 14px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .category-board::-webkit-scrollbar,
    .card-list::-webkit-scrollbar,
    .slides::-webkit-scrollbar,
    .detail-gallery::-webkit-scrollbar,
    .screenshots::-webkit-scrollbar {
      display: none;
    }

    .category-lane {
      flex: 0 0 calc(100vw - 49px);
      height: 100%;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
    }

    .lane-title {
      flex: 0 0 auto;
      padding: 0 5px 13px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .lane-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      letter-spacing: -1px;
      font-weight: 500;
    }

    .lane-title span {
      color: var(--secondary);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 2px 28px;
      scrollbar-width: none;
      overscroll-behavior-y: contain;
    }

    /* Recommendation cards */

    .card {
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid rgba(32, 26, 19, 0.04);
      border-radius: 25px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .media {
      position: relative;
      background: #ece7df;
    }

    .slides {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 357px;
      object-fit: cover;
    }

    .card.secondary .slide img {
      height: 262px;
    }

    .image-arrow {
      position: absolute;
      top: 50%;
      z-index: 3;
      width: 31px;
      height: 31px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 253, 249, 0.86);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
      font-size: 20px;
      color: var(--text);
    }

    .image-arrow.left {
      left: 10px;
    }

    .image-arrow.right {
      right: 10px;
    }

    .pagination {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255, 253, 249, 0.84);
      backdrop-filter: blur(8px);
    }

    .pagination span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(21, 19, 17, 0.25);
    }

    .pagination span.current {
      background: var(--text);
    }

    .card-info {
      padding: 14px 14px 15px;
    }

    .label {
      margin-bottom: 7px;
      color: var(--secondary);
      font-size: 10px;
      letter-spacing: 0.16em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-info h3 {
      margin: 0 0 7px;
      font-size: 19px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.35px;
    }

    .card-info p {
      margin: 0 0 13px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--secondary);
    }

    .details-link {
      border: 0;
      background: none;
      color: var(--text);
      padding: 0;
      font-size: 12px;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Bottom navigation */

    .nav {
      position: absolute;
      z-index: 30;
      left: 0;
      bottom: 0;
      right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      border-top: 1px solid var(--line);
      background: rgba(247, 244, 238, 0.97);
      backdrop-filter: blur(18px);
    }

    .nav-button {
      width: 72px;
      border: 0;
      background: none;
      color: var(--secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-button .icon {
      font-size: 20px;
      line-height: 1;
    }

    .nav-button .caption {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav-button.active {
      color: var(--text);
    }

    /* Detail bottom sheet */

    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      align-items: flex-end;
      background: rgba(19, 16, 13, 0.44);
      backdrop-filter: blur(5px);
    }

    .overlay.visible {
      display: flex;
    }

    .detail-sheet {
      max-height: 93%;
      width: 100%;
      overflow-y: auto;
      background: var(--card);
      border-radius: 31px 31px 0 0;
      padding: 0 0 calc(24px + var(--safe-bottom));
      scrollbar-width: none;
      animation: up 0.22s ease-out;
    }

    @keyframes up {
      from {
        opacity: 0.35;
        transform: translateY(56px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .handle {
      width: 44px;
      height: 5px;
      margin: 11px auto 13px;
      border-radius: 999px;
      background: #d7d1c9;
    }

    .detail-gallery {
      margin: 0 14px;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      border-radius: 24px;
      scrollbar-width: none;
    }

    .detail-gallery img {
      flex: 0 0 100%;
      width: 100%;
      height: 326px;
      object-fit: cover;
      scroll-snap-align: start;
    }

    .detail-copy {
      padding: 18px 18px 0;
    }

    .category-pill {
      display: inline-block;
      margin-bottom: 11px;
      padding: 7px 10px;
      background: #f2efe9;
      border-radius: 999px;
      color: var(--secondary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .detail-copy h3 {
      margin: 0 0 9px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.9px;
    }

    .detail-description {
      margin: 0 0 16px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .detail-box {
      margin-bottom: 11px;
      padding: 14px;
      background: #f5f2ec;
      border-radius: 18px;
      color: #625b53;
      font-size: 13px;
      line-height: 1.45;
    }

    .detail-box strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 13px;
    }

    .source-title {
      margin: 23px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .screenshots {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .screenshot {
      flex: 0 0 238px;
      margin: 0;
      overflow: hidden;
      background: #f5f2ec;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .screenshot img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .screenshot figcaption {
      margin: 0;
      padding: 9px 11px;
      color: var(--secondary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .close {
      width: calc(100% - 36px);
      margin: 23px 18px 0;
      padding: 15px;
      border: 0;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    /* Laptop preview: shows the phone app inside a device frame */

    @media (min-width: 600px) {
      body {
        display: grid;
        place-items: center;
        background: #e4dfd7;
      }

      .app {
        position: relative;
        width: 430px;
        height: min(930px, calc(100vh - 34px));
        border-radius: 38px;
        border: 9px solid #171512;
        box-shadow: 0 30px 90px rgba(25, 20, 16, 0.2);
      }

      .category-lane {
        flex-basis: 365px;
      }
    }
  </style>
</head>

    <div id="overlay" class="overlay" onclick="closeFromBackdrop(event)">
      <section class="detail-sheet" aria-label="Recommendation detail">
        <div class="handle"></div>

        <div id="detailGallery" class="detail-gallery"></div>

        <div class="detail-copy">
          <div id="detailCategory" class="category-pill"></div>
          <h3 id="detailTitle"></h3>

          <div class="detail-box">

        <button class="close" onclick="closeDetail()">Close</button>
      </section>
    </div>
  </div>

    const board = document.getElementById("board");

    function makeDots(number) {
      return Array.from({ length: number }, (_, index) =>
        `<span class="${index === 0 ? "current" : ""}"></span>`
      ).join("");
    }

    function renderBoard() {
      board.innerHTML = categories.map((category, categoryIndex) => `
        <section class="category-lane">
          <div class="lane-title">
            <h2>${category.title}</h2>
            <span>${String(categoryIndex + 1).padStart(2, "0")}</span>
          </div>

          <div class="card-list">
            ${category.products.map((product, productIndex) => `
              <article class="card ${productIndex === 1 ? "secondary" : ""}">
                <div class="media">
                  <div class="slides"
                       id="slides-${categoryIndex}-${productIndex}"
                       onscroll="updateDots(${categoryIndex}, ${productIndex})">
                    ${product.images.map(image => `
                      <div class="slide">
                        <img src="${image}" alt="${product.title}">
                      </div>
                    `).join("")}
                  </div>

                  <button class="image-arrow left"
                          onclick="shiftImage(event, ${categoryIndex}, ${productIndex}, -1)"
                          aria-label="Previous image">‹</button>

                  <button class="image-arrow right"
                          onclick="shiftImage(event, ${categoryIndex}, ${productIndex}, 1)"
                          aria-label="Next image">›</button>

                  <div id="pagination-${categoryIndex}-${productIndex}" class="pagination">
                    ${makeDots(product.images.length)}
                  </div>
                </div>

                <div class="card-info">
                  <div class="label">${category.title}</div>
                  <h3>${product.title}</h3>
                  <p>${product.description}</p>

                  <button class="details-link"
                          onclick="openDetail(${categoryIndex}, ${productIndex})">
                    View details
                  </button>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function shiftImage(event, categoryIndex, productIndex, direction) {
      event.stopPropagation();

      const slides = document.getElementById(`slides-${categoryIndex}-${productIndex}`);

      slides.scrollBy({
        left: direction * slides.clientWidth,
        behavior: "smooth"
      });
    }

    function updateDots(categoryIndex, productIndex) {
      const slides = document.getElementById(`slides-${categoryIndex}-${productIndex}`);
      const markers = document.querySelectorAll(`#pagination-${categoryIndex}-${productIndex} span`);
      const current = Math.round(slides.scrollLeft / slides.clientWidth);

      markers.forEach((marker, index) => {
        marker.classList.toggle("current", index === current);
      });
    }

    function updatePosition() {
      const lane = board.querySelector(".category-lane");

      if (!lane) return;

      const gap = parseFloat(getComputedStyle(board).gap);
      const current = Math.min(
        categories.length - 1,
        Math.max(0, Math.round(board.scrollLeft / (lane.offsetWidth + gap)))
      );

      document.getElementById("position").textContent =
        `${String(current + 1).padStart(2, "0")} / ${String(categories.length).padStart(2, "0")}`;
    }

    function openDetail(categoryIndex, productIndex) {
      const category = categories[categoryIndex];
      const product = category.products[productIndex];

      document.getElementById("detailCategory").textContent = category.title;
      document.getElementById("detailTitle").textContent = product.title;
      document.getElementById("detailDescription").textContent = product.description;

      document.getElementById("detailReason").textContent =
        "You are receiving this recommendation because you uploaded a screenshot with visual cues linked to this mood, object or category.";

      document.getElementById("detailInfo").textContent = product.info;

      document.getElementById("detailGallery").innerHTML =
        product.images
          .map(image => `<img src="${image}" alt="${product.title}">`)
          .join("");

      document.getElementById("screenshots").innerHTML =
        uploadedScreenshots
          .map(screenshot => `
            <figure class="screenshot">
              <img src="${screenshot.src}" alt="${screenshot.label}">
              <figcaption>${screenshot.label}</figcaption>
            </figure>
          `)
          .join("");

      document.getElementById("overlay").classList.add("visible");
    }

    function closeDetail() {
      document.getElementById("overlay").classList.remove("visible");
    }

    function closeFromBackdrop(event) {
      if (event.target.id === "overlay") {
        closeDetail();
      }
    }

    board.addEventListener("scroll", updatePosition);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeDetail();
      }
    });

    renderBoard();
    updatePosition();
  </script>
